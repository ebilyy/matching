# Local dev stand (SAD §7 minus caddy/backup). Usage:
#   docker compose -f docker-compose.dev.yml up --build
# Every value has a default; override via a root .env (see backend/.env.example).
name: product-matching

x-app: &app
  build:
    context: ./backend
    target: dev
  restart: unless-stopped
  volumes:
    # Only sources are shared: each container keeps its own dist/ and node_modules.
    - ./backend/src:/app/src:ro
    - ./backend/migrations:/app/migrations:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    minio:
      condition: service_healthy
  environment: &app-env
    NODE_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    # T07 (storage) consumes the S3_* block; listed here so the stand is complete.
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: ${POSTGRES_USER:-pm}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-pm}
    DB_NAME: ${POSTGRES_DB:-product_matching}
    S3_ENDPOINT: http://minio:9000
    S3_REGION: eu-central-1
    S3_BUCKET: ${S3_BUCKET:-uploads}
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    S3_FORCE_PATH_STYLE: 'true'

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm}
      POSTGRES_DB: ${POSTGRES_DB:-product_matching}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev stand-in for the managed EU bucket (ADR-0006). Official minio/minio
  # images are no longer published; bitnamilegacy is a frozen 2025-07 build.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-uploads}
    ports:
      - '${MINIO_API_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_PORT:-9101}:9001'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies backend/migrations via the TypeORM CLI, then exits (T02).
  migrate:
    <<: *app
    restart: 'no'
    command: ['npm', 'run', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

  api:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: api
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: worker
    # No ports and no HTTP healthcheck: the worker never listens (ADR-0003).

volumes:
  postgres-data:
  minio-data:
